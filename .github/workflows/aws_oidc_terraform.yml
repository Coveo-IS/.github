name: Terragrunt to AWS (OIDC)

run-name: >-
  Terragrunt ${{ inputs.apply_plan && 'apply' || 'plan'}}
  * ${{ inputs.working_directory }}
  * ${{ github.ref_name }}

concurrency:
  group: >-
    terragrunt-${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.working_directory }}-${{ inputs.apply_plan && 'apply' || 'plan' }}
  cancel-in-progress: ${{ !inputs.apply_plan }}

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        description: "Directory where Terragrunt commands run."
        type: string
      aws_region:
        required: false
        default: "us-east-1"
        description: "AWS region for the assumed role session"
        type: string
      aws_role_arn:
        description: "The role Terragrunt/OpenTofu will use to deploy your resources"
        required: true
        type: string
      timeout_minutes:
        description: "The time (in minutes) the job should remain under before forcibly quitting."
        required: false
        default: 5
        type: number
      apply_plan:
        type: boolean
        default: false
        required: false
        description: "When true, runs terragrunt apply on the saved plan."
    outputs:
      terra_plan_artifact_url:
        description: "Result of `terragrunt plan`"
        value: ${{ jobs.deploy.outputs.plan_artifact_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write # Required for OIDC
      contents: read

    outputs:
      plan_artifact_url: ${{ steps.upload_plan.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4-ish

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c #v4-ish
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          

      - name: Install OpenTofu and Terragrunt
        env:
          TOFU_VERSION: "1.12.5"
          TERRAGRUNT_VERSION: "1.1.1"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          curl -fsSL -o "/tmp/tofu_${TOFU_VERSION}_linux_amd64.zip" \
          "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"

          # Download checksums + signature
          curl -fsSL -o /tmp/tofu_SHA256SUMS \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_SHA256SUMS"
          curl -fsSL -o /tmp/tofu_SHA256SUMS.sig \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_SHA256SUMS.sig"

          # Import OpenTofu's release key (key ID is stable across versions)
          gpg --keyserver keyserver.ubuntu.com --recv-keys 0x2FE9B68F9B4E2B37

          # Verify signature, then verify binary
          gpg --verify /tmp/tofu_SHA256SUMS.sig /tmp/tofu_SHA256SUMS
          (cd /tmp && grep "tofu_${TOFU_VERSION}_linux_amd64.zip" /tmp/tofu_SHA256SUMS | sha256sum -c)

          unzip -o "/tmp/tofu_${TOFU_VERSION}_linux_amd64.zip" -d /tmp/tofu
          install /tmp/tofu/tofu "$HOME/.local/bin/tofu"

          curl -fsSL -o "/tmp/terragrunt_linux_amd64" \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          curl -fsSL -o /tmp/terragrunt_SHA256SUMS \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/SHA256SUMS"

          (cd /tmp && grep -E "^[a-f0-9]{64}[[:space:]]+terragrunt_linux_amd64$" terragrunt_SHA256SUMS | sha256sum -c)

          install -m 0755 /tmp/terragrunt_linux_amd64 "$HOME/.local/bin/terragrunt"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          tofu --version
          terragrunt --version

      - name: Verify AWS profile for Terragrunt
        run: aws sts get-caller-identity

      - name: Terragrunt Init
        run: terragrunt init
        working-directory: ${{ inputs.working_directory }}

      - name: Terragrunt Plan
        id: tgplan
        run: |
          set -euo pipefail
          terragrunt plan -no-color -out=tgplan 2>&1 | tee plan.txt
        working-directory: ${{ inputs.working_directory }}

      - name: Terragrunt Apply
        id: tgapply
        if: ${{ inputs.apply_plan }}
        run: terragrunt apply -no-color -auto-approve tgplan
        working-directory: ${{ inputs.working_directory }}

      - name: Upload plan
        id: upload_plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          retention-days: 1 # Derivative pipelines are responsible for maintaining the artifact.
          name: tgplan
          path: |
            ${{ inputs.working_directory }}/tgplan
            ${{ inputs.working_directory }}/plan.txt
